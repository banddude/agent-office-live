<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Office Live</title><style>body{margin:0;background:#121b30;color:#e9f2ff;font:15px system-ui}header{padding:24px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.pill{background:#263650;border-radius:20px;padding:7px 12px}.office{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:20px;max-width:1200px;margin:auto}.desk{height:235px;background:linear-gradient(#26374e 0 68%,#6b5549 68% 74%,#354257 74%);border:2px solid #455b76;border-radius:18px;position:relative;overflow:hidden}.name{position:absolute;top:15px;left:15px;font-weight:700}.model{position:absolute;top:40px;left:15px;font-size:12px;color:#a8bed6}.screen{position:absolute;left:50%;top:73px;transform:translateX(-50%);width:110px;height:76px;background:#091221;border:6px solid #8593a8;border-radius:7px;box-shadow:0 9px #465366}.screen:after{content:'▌';color:#5ee8b4;position:absolute;top:8px;left:12px;animation:blink .65s infinite}.screen .code{padding:9px;color:#61d6ad;font:10px monospace}.person{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);font-size:57px;animation:work 1s infinite alternate}.bubble{position:absolute;right:12px;top:10px;background:#f0f6ff;color:#27364c;border-radius:16px;padding:7px 12px;font-size:12px}.working .bubble{animation:pulse 1s infinite alternate}.idle .person{animation:none}.status{position:absolute;bottom:8px;left:12px;font-size:12px;color:#bed1e8}.dot{display:inline-block;width:8px;height:8px;background:#6d9ff5;border-radius:50%;margin-right:6px}.working .dot{background:#4ce5a4}@keyframes work{to{transform:translateX(-50%) translateY(5px) rotate(3deg)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{to{opacity:.55}}footer{text-align:center;color:#8ba1bd;padding:25px}</style></head><body><header><h1>Agent Office <span style="color:#5ee8b4">LIVE</span></h1><div class="pill" id="info">Connecting…</div></header><main class="office" id="office"></main><footer>Read-only telemetry • No prompts or private transcripts are displayed • Updates every 4 seconds</footer><script>async function update(){try{const r=await fetch('/api/state');const data=await r.json();document.getElementById('info').textContent=data.agents.length+' agents · '+data.filesObserved+' recent session files';document.getElementById('office').innerHTML=data.agents.map((a,i)=>`<div class="desk ${a.state}"><div class="name">${escapeHTML(a.name)}</div><div class="model">${escapeHTML(a.model)}</div><div class="bubble">${a.state==='working'?'Working…':a.state==='thinking'?'Thinking…':'Idle'}</div><div class="screen"><div class="code">&gt; agent.run()<br>▰▰▰▱▱<br>_</div></div><div class="person">${['👩🏽‍💻','🧑🏻‍💻','👨🏾‍💻','👩🏼‍💻'][i%4]}</div><div class="status"><span class="dot"></span>${a.state}${a.kind==='jsonl'?' · '+a.age+'s ago':''}</div></div>`).join('')}catch{document.getElementById('info').textContent='Reconnecting…'}}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}update();setInterval(update,4000)</script></body></html>
